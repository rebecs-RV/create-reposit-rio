<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sua Empresa</title>
    <link rel="stylesheet" href="../CSS/cadastro.css">
    <!-- Removido o link para cadastro.php que estava aqui -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdE/j3uOgqzAIVNvsct+Qo1f1FNSfAiAoii5gUMYjMSN16JGPw==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>

<a href="index.html" class="back-button">
    <i class="fas fa-arrow-left"></i> Voltar para o Site
</a>

<div class="cadastro-wrapper">
    <div class="cadastro-card">
        <h2>Crie sua Conta</h2>
        <p class="subtitle">Junte-se a nós! É rápido e fácil.</p>

        <!-- Adicionado o action para enviar os dados ao PHP -->
        <form id="cadastroForm" method="POST" action="../PHP/cadastro.php">

            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <div class="input-with-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" id="nome" name="nome" required>
                </div>
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <div class="input-with-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" required>
                </div>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="senha" name="senha" required>
                </div>
            </div>

            <div class="input-group">
                <label for="confirmar_senha">Confirmar Senha</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="confirmar_senha" name="confirmar_senha" required>
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="termos_uso" name="termos_uso" required>
                <label for="termos_uso">
                    Eu concordo com os Termos de Serviço
                </label>
            </div>

            <button type="submit" class="btn-cadastro">Criar Conta</button>
        </form>

        <div class="cadastro-footer">
            <p>Já possui uma conta?</p>
            <a href="login.html">Faça o login</a>
        </div>
    </div>
</div>

<script src="../JAVA/cadastro.js"></script>
</body>
</html>
